services:
  - type: web
    name: inbox-bodyguard
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: LLM_ENABLED
        value: "false"
      - key: BODYGUARD_DB
        value: /data/bodyguard.db
      - key: BODYGUARD_CACHE_PATH
        value: /data/llm-cache.json
    disk:
      name: bodyguard
      mountPath: /data
      sizeGB: 1

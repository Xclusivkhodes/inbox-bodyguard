services:
  - type: web
    name: inbox-bodyguard
    runtime: docker
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: LLM_ENABLED
        value: "false"
      - key: PUBLIC_DEMO
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: BODYGUARD_DB
        value: /tmp/bodyguard.db
      - key: ADMIN_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
